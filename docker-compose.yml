# Local deployment: PostgreSQL + API.  Usage:  docker compose up --build
# Needs a .env file (copy .env.example) with SECRET_KEY and POSTGRES_PASSWORD set.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flowsense
    ports:
      - "5432:5432"        # lets you run the backend natively against this database too
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsense -d flowsense"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # inside Docker the database host is the service name 'db', not localhost
      DATABASE_URL: postgresql+psycopg://flowsense:${POSTGRES_PASSWORD}@db:5432/flowsense
      MODEL_DIR: /app/artifacts
      DATASET_PATH: /app/data/traffic_synthetic.csv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
      - data:/app/data

volumes:
  pgdata:
  artifacts:
  data:
